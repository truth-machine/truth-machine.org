baseURL: "https://truth-machine.org/"
languageCode: "en-us"
title: "Truth-Machine"
theme: ["PaperMod"]

params:
  env: production
  description: "Truth-Machine governs how written material is allowed to influence high-stakes evaluation and decision-making."
  defaultTheme: auto
  disableAnchoredHeadings: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  disableThemeToggle: true

  homeInfoParams:
    Title: "Truth-Machine"
    Content: |
      <div style="max-width: 52rem;">
      <em>Infrastructure for interpretive governance in high-stakes decisions.</em><br><br>

      Written material carries real authority in committees, policy, fiduciary, and compliance settings. Yet persuasive form, repetition, and apparent coherence can outpace evidentiary grounding—allowing influence to accumulate without accountability.<br><br>

      Truth-Machine introduces interpretive governance: it governs what signals are admissible and how written influence may propagate and persist, so authority is earned through evidence and reasoning rather than accumulated by language alone.<br><br>

      <strong>Truth-Machine:</strong><br>
      • <strong>Governs admissibility</strong> and downstream influence of written signals<br>
      • Produces <strong>audit-ready interpretive explanations</strong> alongside evaluative outputs<br>
      • Strengthens judgment <strong>without replacing deliberation</strong><br><br>

      <em>Start with <strong>Overview</strong> to see the governance frame and intended use.</em>
      </div>
markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON


