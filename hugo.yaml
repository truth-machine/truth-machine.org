baseURL: "https://truth-machine.org/"
languageCode: "en-us"
title: "Truth-Machine"
theme: ["PaperMod"]

params:
  env: production
  description: "Truth-Machine governs how written material is allowed to influence high-stakes evaluation and decision-making."
  defaultTheme: auto

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true
  disableThemeToggle: true

  homeInfoParams:
    Title: "Truth-Machine"
    Content: |
      *Infrastructure for interpretive governance in high-stakes decisions.<br><br>*

      Written material carries real authority in committees, policy, fiduciary, and compliance settings. Yet persuasive form, repetition, and apparent coherence can outpace evidentiary grounding—allowing influence to accumulate without accountability.<br><br>

      Truth-Machine introduces interpretive governance: it governs what signals are admissible and how influence may propagate and persist, so authority is earned through evidence and reasoning rather than accumulated by language alone.<br><br>

      • Governs admissibility and downstream influence of written signals<br>
      • Produces audit-ready interpretive explanations alongside evaluative outputs<br>
      • Complements existing analytical and AI-assisted review workflows<br>
      • Strengthens judgment without replacing deliberation<br><br>

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON


